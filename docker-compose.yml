# ============================================================================
# Orquestacion local: base de datos + backend
#
# Levanta todo con:   docker compose up --build
# Detiene todo con:   docker compose down
# Borra los datos:    docker compose down -v
# ============================================================================

services:

  mysql:
    image: mysql:8.0
    platform: linux/amd64   # Compatibilidad nativa para Mac Apple Silicon (M1/M2/M3/M4) e Intel
    container_name: renta-mysql-2
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: renta_herramientas_db
    ports:
      - "3308:3306"   # 3308 afuera para no chocar con un MySQL ya instalado
    volumes:
      - mysql_datos:/var/lib/mysql
      # Los scripts se ejecutan en orden alfabetico la primera vez que
      # arranca el contenedor, por eso van numerados.
      - ./database/instalar_todo.sql:/docker-entrypoint-initdb.d/instalar_todo.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${DB_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - renta-red

  backend:
    build: .
    container_name: renta-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy   # espera a que MySQL responda de verdad
    environment:
      # Dentro de la red de Docker el host es el nombre del servicio, no localhost
      DB_URL: jdbc:mysql://mysql:3306/renta_herramientas_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      DB_USERNAME: root
      DB_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      JPA_DDL_AUTO: none
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      JWT_EXPIRATION_MS: 86400000
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:*,http://127.0.0.1:*}
    ports:
      - "8080:8080"
    networks:
      - renta-red

volumes:
  mysql_datos:

networks:
  renta-red:
    driver: bridge
